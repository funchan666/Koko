name: Koko
options:
  xcodeVersion: "27.0"
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
  configs:
    Release:
      SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      COPY_PHASE_STRIP: YES
packages:
  Ably:
    url: https://github.com/ably/ably-cocoa.git
    exactVersion: 1.4.0
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.12.2
targets:
  Koko:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
        com.apple.InAppPurchase:
          enabled: 1
        com.apple.SignInWithApple:
          enabled: 1
    dependencies:
      - package: Ably
        product: Ably
      - package: Alamofire
        product: Alamofire
      - sdk: StoreKit.framework
      - sdk: AuthenticationServices.framework
      - sdk: WebKit.framework
      - sdk: PhotosUI.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
    sources:
      - path: Koko
        excludes:
          - Resources
          - Configuration
      - path: Koko/Resources
        # Includes en/zh-Hans/es/fr/ja localization variants and original artwork.
        # Fonts is a folder resource so UIAppFonts uses stable Fonts/*.ttf paths.
        excludes:
          - CommunityMedia
          - Fonts
        buildPhase: resources
      - path: Koko/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Koko/Resources/CommunityMedia
        type: folder
        buildPhase: resources
      - path: photos
        type: folder
        buildPhase: resources
      - path: videos
        type: folder
        buildPhase: resources
      - path: Koko/Configuration
        buildPhase: none
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "$(RECOMMENDED_IPHONEOS_DEPLOYMENT_TARGET)"
        PRODUCT_NAME: Koko
        PRODUCT_BUNDLE_IDENTIFIER: com.auroracove.kokoconversation
        INFOPLIST_FILE: Koko/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Koko/Configuration/Koko.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      gatherCoverageData: false

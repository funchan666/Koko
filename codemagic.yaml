workflows:
  koko-ios-app-store:
    name: Koko iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Koko

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.auroracove.kokoconversation

      vars:
        BUNDLE_ID: "com.auroracove.kokoconversation"
        XCODE_PROJECT: "Koko.xcodeproj"
        XCODE_SCHEME: "Koko"
        APP_STORE_APPLE_ID: "6821861746"

      xcode: 26.5

    scripts:
      - name: Verify native iOS project configuration
        script: |
          set -euo pipefail
          test -d "$CM_BUILD_DIR/$XCODE_PROJECT"
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" \
            "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"

      - name: Set up App Store signing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles

      - name: Set next App Store build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          # Authentication or network failures must stop the build, not reuse a number.
          LATEST_BUILD_NUMBER="$(
            app-store-connect get-latest-testflight-build-number \
              "$APP_STORE_APPLE_ID"
          )"

          # An app with no uploaded builds starts at build 1.
          case "$LATEST_BUILD_NUMBER" in
            '') LATEST_BUILD_NUMBER=0 ;;
            *[!0-9]*)
              echo "App Store Connect returned a non-integer build number." >&2
              exit 1
              ;;
          esac
          NEXT_BUILD_NUMBER=$((10#$LATEST_BUILD_NUMBER + 1))

          echo "Using build number: $NEXT_BUILD_NUMBER"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"

          # Publishing uploads IPA artifacts; fail explicitly if export produced none.
          find "$CM_BUILD_DIR/build/ios/ipa" -maxdepth 1 -name '*.ipa' -type f | grep -q .

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - funchan@126.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        # Upload the IPA, leaving beta review and App Store review submission manual.
        submit_to_testflight: false
        submit_to_app_store: false
